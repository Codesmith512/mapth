<!doctype html>
<html>
	<head>
		<meta charset="utf-8">
		<title>{{ page.title }}</title>
		<link rel="stylesheet" href="{{ "/assets/css/style.css?v=" | append: site.github.build_revision | relative_url }}">
		<script src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js" defer></script>
		</script>
		<script>
window.MathJax = {
  tex: {
	inlineMath: {'[+]': [['$', '$']]}
  }
};
		</script>
		<style>
body {
	display: flex;
	justify-content: center;
}

body div.container {
	max-width: 50rem;

	border-radius: 5rem;
	padding: 5rem;
	background-color: #ffffffaa;
}

body h1 {
	text-transform: capitalize;
}

pre {
	background: none;
	border: none;
}

body::before {
  content: "";
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: -1;

  display: block;
  background-image: url('/mapth/media/mapth.webp');
  background-size:cover;
  width: 100%;
  height: 100%;

  filter: blur(5px);
}
		</style>
	</head>
	<body>
		<div class="container">
			<h1>{{ page.title }}</h1>
			<em>{{ page.aka }}</em>
			{{ content }}
		</div>
  	</body>
	<footer>
		<script type="module">
import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
mermaid.initialize({
	startOnLoad: false,
	theme: 'base',
	themeVariables: {
		primaryColor: "#ddd"
	}
});

mermaid.run({ querySelector: '.language-mermaid' });
		</script>
	</footer>
</html>
